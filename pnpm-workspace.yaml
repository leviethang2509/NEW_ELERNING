packages:
  - apps/*
  - packages/*

# pnpm 11 chặn build script mặc định; chỉ cho phép package cần thiết.
allowBuilds:
  esbuild: true

# Phiên bản dùng chung, khai báo trong package.json bằng `catalog:`.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.13.4
  eslint: ^10.10.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  prettier: ^3.9.6
  tsup: ^8.5.1
  turbo: ^2.10.12
  typescript: ^5.9.3
  typescript-eslint: ^8.70.0
